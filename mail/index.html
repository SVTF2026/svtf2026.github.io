<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>SVTF Mail System</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background:
        linear-gradient(
          135deg,
          #061a35,
          #0b376d
        );
    }

    .card {
      width: 100%;
      max-width: 520px;
      overflow: hidden;
      text-align: center;
      background: #ffffff;
      border-radius: 18px;
      box-shadow:
        0 18px 45px rgba(0, 0, 0, 0.28);
    }

    .gold-line {
      height: 8px;
      background: #d4a017;
    }

    .content {
      padding: 38px 30px 34px;
    }

    .emblem {
      width: 125px;
      height: 125px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      border: 5px solid #d4a017;
      border-radius: 50%;
      color: #ffffff;
      background: #0b2a53;
      font-size: 14px;
      font-weight: bold;
      line-height: 1.35;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #0b2a53;
      font-size: 30px;
    }

    .temple-name {
      margin-top: 12px;
      color: #555555;
      font-size: 18px;
      font-weight: bold;
    }

    .notice {
      margin: 28px 0;
      padding: 16px;
      color: #333333;
      background: #fff8e5;
      border: 1px solid #ead18a;
      border-radius: 10px;
      line-height: 1.5;
    }

    .access-button {
      display: block;
      width: 100%;
      padding: 16px 20px;
      color: #ffffff;
      background: #0b2a53;
      border-radius: 9px;
      font-size: 17px;
      font-weight: bold;
      text-decoration: none;
      transition:
        background 0.2s,
        transform 0.2s;
    }

    .access-button:hover {
      background: #124681;
      transform: translateY(-1px);
    }

    .footer {
      margin-top: 24px;
      color: #777777;
      font-size: 13px;
      line-height: 1.5;
    }

    @media (max-width: 480px) {
      body {
        padding: 14px;
      }

      .content {
        padding: 30px 20px;
      }

      h1 {
        font-size: 25px;
      }

      .temple-name {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="gold-line"></div>

    <div class="content">

      <div class="emblem">
        Sri Venkateswara<br>
        Temple France
      </div>

      <h1>SVTF Mail System</h1>

      <div class="temple-name">
        Sri Venkateswara Temple France
      </div>

      <div class="notice">
        Cet espace est réservé aux administrateurs autorisés
        de Sri Venkateswara Temple France.
      </div>

      <a
        class="access-button"
        href="https://script.google.com/macros/s/AKfycbwx5Ks7N2DLABdKfoOMX0nQUxbijP0QfavFkcn_x3Y7fvTtBTVEiVLA8E9CLq95eoH4/exec"
        target="_blank"
        rel="noopener noreferrer"
      >
        ACCÉDER AU SYSTÈME DE MAIL
      </a>

      <div class="footer">
        Accès sécurisé réservé aux administrateurs SVTF
      </div>

    </div>

  </main>

</body>
</html>
