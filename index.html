<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>SVTF 2026 Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    h1 {
      font-size: 26px;
    }

    #reader {
      width: 100%;
      max-width: 400px;
      margin: 20px auto;
    }

    button {
      font-size: 18px;
      padding: 14px 25px;
      margin: 10px;
      border: none;
      border-radius: 8px;
      background: #1a73e8;
      color: white;
      cursor: pointer;
    }

    #stopButton {
      background: #777;
    }

    #result {
      background: white;
      padding: 20px;
      margin-top: 20px;
      border-radius: 10px;
      font-size: 18px;
    }

    input {
      font-size: 24px;
      width: 120px;
      text-align: center;
      padding: 10px;
      margin: 10px;
    }

    .error {
      color: red;
      font-weight: bold;
    }

    .success {
      color: green;
      font-weight: bold;
    }

  </style>
</head>

<body>

  <h1>📷 SVTF 2026</h1>

  <h2>Contrôle de présence</h2>

  <button onclick="startScanner()">
    📷 Scanner le QR
  </button>

  <button id="stopButton" onclick="stopScanner()">
    Arrêter
  </button>

  <div id="reader"></div>

  <div id="result">
    Prêt à scanner.
  </div>


  <script>

    // =====================================================
    // URL DE TON APPS SCRIPT
    // =====================================================

    const API_URL =
      "https://script.google.com/macros/s/AKfycbxRHrdA6l0YYRBOciXxUFC3g-Ds7rh5wYM6xYIsG2RlgwOWp7fBHBGagT2p9IGhuJfxbw/exec";


    let scanner = null;


    // =====================================================
    // DÉMARRER LE SCANNER
    // =====================================================

    async function startScanner() {

      const result =
        document.getElementById("result");

      result.innerHTML =
        "📷 Recherche de la caméra...";


      try {

        const cameras =
          await Html5Qrcode.getCameras();


        if (!cameras || cameras.length === 0) {

          result.innerHTML =
            "<span class='error'>" +
            "❌ Aucune caméra détectée." +
            "</span>";

          return;

        }


        let cameraId =
          cameras[0].id;


        // Chercher la caméra arrière

        for (let camera of cameras) {

          const label =
            (camera.label || "").toLowerCase();


          if (
            label.includes("back") ||
            label.includes("rear") ||
            label.includes("environment") ||
            label.includes("arrière")
          ) {

            cameraId =
              camera.id;

            break;

          }

        }


        scanner =
          new Html5Qrcode("reader");


        await scanner.start(

          cameraId,

          {
            fps: 10,

            qrbox: {
              width: 250,
              height: 250
            }
          },


          function(decodedText) {

            scanner.stop();

            verifyFamily(decodedText);

          },


          function(errorMessage) {

            // Ignorer les erreurs normales

          }

        );


        result.innerHTML =
          "📷 Présentez le QR code devant la caméra.";


      } catch (error) {

        result.innerHTML =
          "<span class='error'>" +
          "❌ Impossible d'utiliser la caméra.<br><br>" +
          error +
          "</span>";

      }

    }


    // =====================================================
    // ARRÊTER LE SCANNER
    // =====================================================

    function stopScanner() {

      if (scanner) {

        scanner
          .stop()
          .catch(function() {});

      }


      document.getElementById("reader")
        .innerHTML = "";


      document.getElementById("result")
        .innerHTML =
        "Scanner arrêté.";

    }


    // =====================================================
    // RECHERCHER LA FAMILLE
    // =====================================================

    async function verifyFamily(familyId) {

      const result =
        document.getElementById("result");


      result.innerHTML =
        "⏳ Recherche de la famille...";


      try {

        const response =
          await fetch(API_URL, {

            method: "POST",

            headers: {
              "Content-Type":
                "text/plain;charset=utf-8"
            },

            body: JSON.stringify({

              action:
                "findFamily",

              familyId:
                familyId

            })

          });


        const data =
          await response.json();


        if (!data.success) {

          result.innerHTML =
            "<span class='error'>" +
            "❌ " +
            data.message +
            "</span>";

          return;

        }


        showFamily(data);


      } catch (error) {

        result.innerHTML =
          "<span class='error'>" +
          "❌ Erreur de connexion.<br><br>" +
          error.message +
          "</span>";

      }

    }


    // =====================================================
    // AFFICHER LA FAMILLE
    // =====================================================

function showFamily(data) {

  let message = "";

  // =====================================================
  // QR DÉJÀ ENREGISTRÉ
  // =====================================================

  if (data.alreadyScanned) {

    message =

      "<span class='error'>" +
      "⚠️ QR DÉJÀ ENREGISTRÉ" +
      "</span>" +

      "<br><br>" +

      "<strong>" +
      data.familyId +
      "</strong>" +

      "<br><br>" +

      "Participants inscrits : " +
      "<strong>" +
      data.registered +
      "</strong>" +

      "<br><br>" +

      "Participants déjà présents : " +
      "<strong>" +
      data.alreadyPresent +
      "</strong>" +

      "<br><br>" +

      "Combien de nouvelles personnes arrivent maintenant ?" +

      "<br>" +

      "<input " +
      "id='presentNow' " +
      "type='number' " +
      "min='0' " +
      "inputmode='numeric'>" +

      "<br>" +

      "<button onclick='savePresence(" +
      JSON.stringify(data.familyId) +
      ")'>" +

      "➕ AJOUTER" +

      "</button>";

  }

  // =====================================================
  // PREMIER SCAN
  // =====================================================

  else {

    message =

      "<strong>" +
      data.familyId +
      "</strong>" +

      "<br><br>" +

      "Participants inscrits : " +

      "<strong>" +
      data.registered +
      "</strong>" +

      "<br><br>" +

      "Combien de personnes sont présentes maintenant ?" +

      "<br>" +

      "<input " +
      "id='presentNow' " +
      "type='number' " +
      "min='0' " +
      "inputmode='numeric'>" +

      "<br>" +

      "<button onclick='savePresence(" +
      JSON.stringify(data.familyId) +
      ")'>" +

      "✅ VALIDER" +

      "</button>";

  }


  document.getElementById("result").innerHTML =
    message;

}


    // =====================================================
    // ENREGISTRER LA PRÉSENCE
    // =====================================================

    async function savePresence(familyId) {

      const input =
        document.getElementById("presentNow");


      const number =
        Number(input.value);


      if (
        !Number.isInteger(number) ||
        number < 0
      ) {

        alert(
          "Veuillez entrer un nombre valide."
        );

        return;

      }


      document.getElementById("result")
        .innerHTML =
        "⏳ Enregistrement...";


      try {

        const response =
          await fetch(API_URL, {

            method: "POST",

            headers: {
              "Content-Type":
                "text/plain;charset=utf-8"
            },

            body: JSON.stringify({

              action:
                "savePresence",

              familyId:
                familyId,

              numberNow:
                number

            })

          });


        const data =
          await response.json();


        if (!data.success) {

          document.getElementById("result")
            .innerHTML =

            "<span class='error'>" +

            "❌ " +

            data.message +

            "</span>";

          return;

        }


        document.getElementById("result")
          .innerHTML =

          "<span class='success'>" +

          "✅ Présence enregistrée" +

          "<br><br>" +

          familyId +

          "<br><br>" +

          "Participants inscrits : " +

          data.registered +

          "<br>" +

          "Total présent : " +

          data.totalPresent +

          "<br>" +

          "Participants supplémentaires : " +

          data.additional +

          "</span>" +

          "<br><br>" +

          "<button onclick='startScanner()'>" +

          "📷 SCANNER LE PROCHAIN QR" +

          "</button>";


      } catch (error) {

        document.getElementById("result")
          .innerHTML =

          "<span class='error'>" +

          "❌ Erreur de connexion.<br><br>" +

          error.message +

          "</span>";

      }

    }

  </script>

</body>
</html>
