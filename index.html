  <body>
<div id="loginSection">

    placeholder="Code bénévole"
  >

  <br>

  <button onclick="loginVolunteer()">
    SE CONNECTER

</div>
    <div id="appSection" style="display:none;">
  <div id="topSection">

  <div class="temple-header">
    <div class="ornament">❈ ॐ ❈</div>
    <div class="temple-name">
      Sri Venkateswara Temple France
    </div>
  </div>

  <h1>📷 SVTF 2026</h1>

  <h2 id="modeTitle">Choisissez une opération</h2>

</div>

  <div class="mode-buttons">

    <button onclick="setModeAndScan('presence')" id="presenceModeButton">
  📷 CONTRÔLE PRÉSENCE
</button>

<button onclick="setModeAndScan('gift')" id="giftModeButton">

  <script>

    // =====================================================
    // URL DE TON APPS SCRIPT
    // =====================================================

    const API_URL =
      "https://script.google.com/macros/s/AKfycbxRHrdA6l0YYRBOciXxUFC3g-Ds7rh5wYM6xYIsG2RlgwOWp7fBHBGagT2p9IGhuJfxbw/exec";


    let scanner = null;
// =====================================================
// SESSION BÉNÉVOLE
// =====================================================

let volunteerToken =
  sessionStorage.getItem("svtfVolunteerToken") || "";
let volunteerToken =
  sessionStorage.getItem("svtfVolunteerToken") || "";


// =====================================================
// SESSION EXPIRÉE / ACCÈS REFUSÉ
// =====================================================

function handleUnauthorized(data) {

  if (!data || !data.unauthorized) {
    return false;
  }

  volunteerToken = "";

  sessionStorage.removeItem(
    "svtfVolunteerToken"
  );

  document.getElementById("appSection")
    .style.display = "none";

  document.getElementById("loginSection")
    .style.display = "block";

  document.getElementById("loginMessage")
    .innerHTML =
    "<span class='error'>" +
    "🔒 Session expirée. Veuillez saisir de nouveau le code bénévole." +
    "</span>";

  return true;
}


// =====================================================
// CONNEXION BÉNÉVOLE
// =====================================================

async function loginVolunteer() {
// =====================================================
// CONNEXION BÉNÉVOLE
// =====================================================

async function loginVolunteer() {

  const code =
    document.getElementById("volunteerCode").value.trim();

  const message =
    document.getElementById("loginMessage");

  if (!code) {

    message.innerHTML =
      "<span class='error'>Veuillez entrer le code bénévole.</span>";

    return;
  }

  message.innerHTML =
    "⏳ Vérification...";

  try {

    const response =
      await fetch(API_URL, {

        method: "POST",

        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },

        body: JSON.stringify({
          action: "loginVolunteer",
          code: code
        })

      });

    const data =
      await response.json();

    if (!data.success) {

      message.innerHTML =
        "<span class='error'>❌ " +
        data.message +
        "</span>";

      return;
    }

    volunteerToken =
      data.token;

    sessionStorage.setItem(
      "svtfVolunteerToken",
      volunteerToken
    );

    document.getElementById("loginSection")
      .style.display = "none";

    document.getElementById("appSection")
      .style.display = "block";

  } catch (error) {

    message.innerHTML =
      "<span class='error'>❌ Erreur de connexion.</span>";

  }

}
// =====================================================
// AFFICHAGE AUTOMATIQUE SI SESSION DÉJÀ OUVERTE
// =====================================================

window.addEventListener("load", function() {

  if (volunteerToken) {

    document.getElementById("loginSection")
      .style.display = "none";

    document.getElementById("appSection")
      .style.display = "block";

  }

});
// =====================================================
// MODE DU SCANNER : PRÉSENCE OU RETURN GIFT
// =====================================================

let scannerMode = "presence";

function setMode(mode) {

  scannerMode = mode;

  const title =
    document.getElementById("modeTitle");

  const result =
    document.getElementById("result");


  if (mode === "gift") {

    title.innerHTML =
      "🎁 Distribution Return Gift";

    result.innerHTML =
      "Mode Return Gift sélectionné.<br><br>" +
      "📷 Appuyez sur Scanner le QR.";

  } else {

    title.innerHTML =
      "Contrôle de présence";

    result.innerHTML =
      "Mode contrôle de présence sélectionné.<br><br>" +
      "📷 Appuyez sur Scanner le QR.";

  }

}

    function setModeAndScan(mode) {

  setMode(mode);

  const result =
    document.getElementById("result");

  if (mode === "gift") {

    result.innerHTML =
      "🎁 Return Gift<br>" +
      "📷 Scanner le QR code";

  } else {

    result.innerHTML =
      "📷 Contrôle de présence<br>" +
      "Scanner le QR code";

  } 
  document.getElementById("topSection").style.display = "none";

  startScanner();

}
    // =====================================================
    // DÉMARRER LE SCANNER
    // =====================================================

    async function startScanner() {

      const result =
        document.getElementById("result");

      result.innerHTML =
        "📷 Recherche de la caméra...";


      try {

        const cameras =
          await Html5Qrcode.getCameras();


        if (!cameras || cameras.length === 0) {

          result.innerHTML =
            "<span class='error'>" +
            "❌ Aucune caméra détectée." +
            "</span>";

          return;

        }


        let cameraId =
          cameras[0].id;


        // Chercher la caméra arrière

        for (let camera of cameras) {

          const label =
            (camera.label || "").toLowerCase();


          if (
            label.includes("back") ||
            label.includes("rear") ||
            label.includes("environment") ||
            label.includes("arrière")
          ) {

            cameraId =
              camera.id;

            break;

          }

        }


        scanner =
          new Html5Qrcode("reader");


        await scanner.start(

          cameraId,

          {
            fps: 10,

            qrbox: {
              width: 250,
              height: 250
            }
          },


          function(decodedText) {

  scanner.stop();

  if (scannerMode === "gift") {

    verifyReturnGift(decodedText);

  } else {

    verifyFamily(decodedText);

  }

},
          


          function(errorMessage) {

            // Ignorer les erreurs normales

          }

        );


        result.innerHTML =
          "📷 Présentez le QR code devant la caméra.";


      } catch (error) {

        result.innerHTML =
          "<span class='error'>" +
          "❌ Impossible d'utiliser la caméra.<br><br>" +
          error +
          "</span>";

      }

    }


    // =====================================================
    // ARRÊTER LE SCANNER
    // =====================================================

    async function stopScanner() {

  try {

    if (scanner && scanner.isScanning) {
      await scanner.stop();
    }

  } catch (error) {

    // Si la caméra est déjà arrêtée, on continue normalement.

  }

  try {

    if (scanner) {
      await scanner.clear();
    }

  } catch (error) {

    // Pas grave si le scanner est déjà nettoyé.

  }

  scanner = null;

  // Nettoyer la zone caméra
  document.getElementById("reader").innerHTML = "";

  // Réafficher le haut
  document.getElementById("topSection").style.display = "block";

  // Revenir au titre initial
  document.getElementById("modeTitle").innerHTML =
    "Choisissez une opération";

  // Réinitialiser le mode par défaut
  scannerMode = "presence";

  // Réinitialiser le message
  document.getElementById("result").innerHTML =
    "Prêt à scanner.";

}


    // =====================================================
    // RECHERCHER LA FAMILLE
    // =====================================================

    async function verifyFamily(familyId) {

      const result =
        document.getElementById("result");


      result.innerHTML =
        "⏳ Recherche de la famille...";


      try {

        const response =
          await fetch(API_URL, {

            method: "POST",

            headers: {
              "Content-Type":
                "text/plain;charset=utf-8"
            },

           body: JSON.stringify({

  action: "findFamily",

  familyId: familyId,

  token: volunteerToken

})

          });


        const data =
          await response.json();


        if (!data.success) {
          if (handleUnauthorized(data)) {
  return;
}

          result.innerHTML =
            "<span class='error'>" +
            "❌ " +
            data.message +
            "</span>";

          return;

        }


        showFamily(data);


      } catch (error) {

        result.innerHTML =
          "<span class='error'>" +
          "❌ Erreur de connexion.<br><br>" +
          error.message +
          "</span>";

      }

    }

// =====================================================
// RETURN GIFT - VÉRIFIER LE QR
// =====================================================

async function verifyReturnGift(familyId) {

  const result =
    document.getElementById("result");

  result.innerHTML =
    "⏳ Vérification Return Gift...";

  try {

    const response =
      await fetch(API_URL, {

        method: "POST",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body: JSON.stringify({

  action: "findReturnGift",

  familyId: familyId,

  token: volunteerToken

})

      });

    const data =
      await response.json();


    if (!data.success) {
      if (handleUnauthorized(data)) {
  return;
}

      result.innerHTML =
        "<span class='error'>" +
        "❌ " +
        data.message +
        "</span>";

      return;
    }


    // ===============================================
    // CADEAUX DÉJÀ DISTRIBUÉS
    // ===============================================

    if (data.alreadyDistributed) {

      result.innerHTML =

        "<span class='error'>" +

        "⚠️ RETURN GIFT DÉJÀ DISTRIBUÉ" +

        "</span>" +

        "<br><br>" +

        "<strong>" +
        data.familyId +
        "</strong>" +

        "<br><br>" +

        "Cadeaux déjà remis : " +

        "<strong>" +
        data.giftsGiven +
        "</strong>";

      return;
    }


    // ===============================================
    // CADEAUX À DISTRIBUER
    // ===============================================

    result.innerHTML =

      "<strong>" +
      data.familyId +
      "</strong>" +

      "<br><br>" +

      "Participants présents : " +

      "<strong>" +
      data.totalPresent +
      "</strong>" +

      "<br><br>" +

      "🎁 Cadeaux à remettre : " +

      "<strong>" +
      data.giftsAllowed +
      "</strong>" +

      "<br><br>" +

      "<button onclick='saveReturnGift(" +
      JSON.stringify(data.familyId) +
      ")'>" +

      "🎁 DISTRIBUER" +

      "</button>";


  } catch (error) {

    result.innerHTML =
      "<span class='error'>" +
      "❌ Erreur de connexion.<br><br>" +
      error.message +
      "</span>";

  }

}
    
    // =====================================================
    // AFFICHER LA FAMILLE
    // =====================================================

function showFamily(data) {

  let message = "";

  // =====================================================
  // QR DÉJÀ ENREGISTRÉ
  // =====================================================

  if (data.alreadyScanned) {

    message =

      "<span class='error'>" +
      "⚠️ QR DÉJÀ ENREGISTRÉ" +
      "</span>" +

      "<br><br>" +

      "<strong>" +
      data.familyId +
      "</strong>" +

      "<br><br>" +

      "Participants inscrits : " +
      "<strong>" +
      data.registered +
      "</strong>" +

      "<br><br>" +

      "Participants déjà présents : " +
      "<strong>" +
      data.alreadyPresent +
      "</strong>" +

      "<br><br>" +

      "Combien de nouvelles personnes arrivent maintenant ?" +

      "<br>" +

      "<input " +
      "id='presentNow' " +
      "type='number' " +
      "min='0' " +
      "inputmode='numeric'>" +

      "<br>" +

      "<button onclick='savePresence(" +
      JSON.stringify(data.familyId) +
      ")'>" +

      "➕ AJOUTER" +

      "</button>";

  }

  // =====================================================
  // PREMIER SCAN
  // =====================================================

  else {

    message =

      "<strong>" +
      data.familyId +
      "</strong>" +

      "<br><br>" +

      "Participants inscrits : " +

      "<strong>" +
      data.registered +
      "</strong>" +

      "<br><br>" +

      "Combien de personnes sont présentes maintenant ?" +

      "<br>" +

      "<input " +
      "id='presentNow' " +
      "type='number' " +
      "min='0' " +
      "inputmode='numeric'>" +

      "<br>" +

      "<button onclick='savePresence(" +
      JSON.stringify(data.familyId) +
      ")'>" +

      "✅ VALIDER" +

      "</button>";

  }


  document.getElementById("result").innerHTML =
    message;

}


    // =====================================================
    // ENREGISTRER LA PRÉSENCE
    // =====================================================

    async function savePresence(familyId) {

      const input =
        document.getElementById("presentNow");


      const number =
        Number(input.value);


      if (
        !Number.isInteger(number) ||
        number < 0
      ) {

        alert(
          "Veuillez entrer un nombre valide."
        );

        return;

      }


      document.getElementById("result")
        .innerHTML =
        "⏳ Enregistrement...";


      try {

        const response =
          await fetch(API_URL, {

            method: "POST",

            headers: {
              "Content-Type":
                "text/plain;charset=utf-8"
            },

           body: JSON.stringify({

  action: "savePresence",

  familyId: familyId,

  numberNow: number,

  token: volunteerToken

})

          });


        const data =
          await response.json();


        if (!data.success) {
          if (handleUnauthorized(data)) {
  return;
}

          document.getElementById("result")
            .innerHTML =

            "<span class='error'>" +

            "❌ " +

            data.message +

            "</span>";

          return;

        }


        document.getElementById("result")
          .innerHTML =

          "<span class='success'>" +

          "✅ Présence enregistrée" +

          "<br><br>" +

          familyId +

          "<br><br>" +

          "Participants inscrits : " +

          data.registered +

          "<br>" +

          "Total présent : " +

          data.totalPresent +

          "<br>" +

          "Participants supplémentaires : " +

          data.additional +

          "</span>" +

          "<br><br>" +

          "<button onclick='startScanner()'>" +

          "📷 SCANNER LE PROCHAIN QR" +

          "</button>";


      } catch (error) {

        document.getElementById("result")
          .innerHTML =

          "<span class='error'>" +

          "❌ Erreur de connexion.<br><br>" +

          error.message +

          "</span>";

      }

    }
// =====================================================
// RETURN GIFT - ENREGISTRER LA DISTRIBUTION
// =====================================================

async function saveReturnGift(familyId) {

  const result =
    document.getElementById("result");

  result.innerHTML =
    "⏳ Enregistrement des cadeaux...";

  try {

    const response =
      await fetch(API_URL, {

        method: "POST",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body: JSON.stringify({

  action: "saveReturnGift",

  familyId: familyId,

  token: volunteerToken

})

      });


    const data =
      await response.json();


    // Cadeaux déjà distribués
    if (!data.success) {
      if (handleUnauthorized(data)) {
  return;
}

      if (data.alreadyDistributed) {

        result.innerHTML =

          "<span class='error'>" +

          "⚠️ RETURN GIFT DÉJÀ DISTRIBUÉ" +

          "</span>" +

          "<br><br>" +

          "<strong>" +
          familyId +
          "</strong>" +

          "<br><br>" +

          "Cadeaux déjà remis : " +

          "<strong>" +
          data.giftsGiven +
          "</strong>";

        return;

      }


      result.innerHTML =

        "<span class='error'>" +

        "❌ " +

        data.message +

        "</span>";

      return;

    }


    // Distribution réussie
    result.innerHTML =

      "<span class='success'>" +

      "✅ RETURN GIFT DISTRIBUÉ" +

      "</span>" +

      "<br><br>" +

      "<strong>" +
      data.familyId +
      "</strong>" +

      "<br><br>" +

      "Participants présents : " +

      "<strong>" +
      data.totalPresent +
      "</strong>" +

      "<br><br>" +

      "🎁 Cadeaux remis : " +

      "<strong>" +
      data.giftsGiven +
      "</strong>" +

      "<br><br>" +

      "<button onclick='startScanner()'>" +

      "🎁 SCANNER LE PROCHAIN QR" +

      "</button>";


  } catch (error) {

    result.innerHTML =

      "<span class='error'>" +

      "❌ Erreur de connexion.<br><br>" +

      error.message +

      "</span>";

  }

}
