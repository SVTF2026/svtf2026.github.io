<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>SVTF 2026 Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    h1 {
      font-size: 26px;
    }

    #reader {
      width: 100%;
      max-width: 400px;
      margin: 20px auto;
    }

    button {
      font-size: 18px;
      padding: 14px 25px;
      margin: 10px;
      border: none;
      border-radius: 8px;
      background: #1a73e8;
      color: white;
      cursor: pointer;
    }

    #stopButton {
      background: #777;
    }

    #result {
      background: white;
      padding: 20px;
      margin-top: 20px;
      border-radius: 10px;
      font-size: 18px;
    }

    input {
      font-size: 24px;
      width: 120px;
      text-align: center;
      padding: 10px;
      margin: 10px;
    }

    .error {
      color: red;
      font-weight: bold;
    }

    .success {
      color: green;
      font-weight: bold;
    }
/* =====================================================
   STYLE SVTF
   ===================================================== */

.temple-header {
  background: linear-gradient(135deg, #fff8e1, #ffffff);
  border: 2px solid #d4a017;
  border-radius: 14px;
  padding: 14px 10px;
  margin: 0 auto 20px auto;
  max-width: 600px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.08);
}

.temple-name {
  font-size: 20px;
  font-weight: bold;
  color: #8b1a1a;
}

.ornament {
  color: #d4a017;
  font-size: 22px;
  margin-bottom: 5px;
}

.mode-buttons {
  margin: 10px auto;
}

#presenceModeButton {
  background: #1a73e8;
}

#giftModeButton {
  background: #8b1a1a;
}

.temple-footer {
  max-width: 600px;
  margin: 30px auto 10px auto;
  padding: 16px 10px;
  border-top: 2px solid #d4a017;
  color: #8b1a1a;
  font-size: 18px;
  font-weight: bold;
}

.footer-ornament {
  color: #d4a017;
  font-size: 20px;
  margin-bottom: 5px;
}
<style>

  body {
    ...
  }

  h1 {
    ...
  }

  /* tous tes autres styles */
  ...

  @media (max-width: 600px) {

    body {
      padding: 10px;
    }

    .temple-header {
      padding: 8px;
      margin-bottom: 10px;
    }

    .temple-name {
      font-size: 18px;
    }

    .ornament {
      font-size: 16px;
      margin-bottom: 2px;
    }

    h1 {
      font-size: 21px;
      margin: 8px 0;
    }

    h2 {
      font-size: 18px;
      margin: 8px 0;
    }

    button {
      font-size: 16px;
      padding: 11px 15px;
      margin: 6px;
    }

    #reader {
      margin: 10px auto;
    }

    #result {
      margin-top: 10px;
      padding: 12px;
    }

  }

</style>
</head>

  <body>

  <div class="temple-header">
    <div class="ornament">❈ ॐ ❈</div>
    <div class="temple-name">
      Sri Venkateswara Temple France
    </div>
  </div>

  <h1>📷 SVTF 2026</h1>

<h2 id="modeTitle">Choisissez une opération</h2>

  <div class="mode-buttons">

    <button onclick="setModeAndScan('presence')" id="presenceModeButton">
  📷 CONTRÔLE PRÉSENCE
</button>

<button onclick="setModeAndScan('gift')" id="giftModeButton">
  🎁 RETURN GIFT
</button>

  </div>

  <br>

  <button id="stopButton" onclick="stopScanner()">
    Arrêter
  </button>
  <div id="reader"></div>

  <div id="result">
    Prêt à scanner.
  </div>


  <script>

    // =====================================================
    // URL DE TON APPS SCRIPT
    // =====================================================

    const API_URL =
      "https://script.google.com/macros/s/AKfycbxRHrdA6l0YYRBOciXxUFC3g-Ds7rh5wYM6xYIsG2RlgwOWp7fBHBGagT2p9IGhuJfxbw/exec";


    let scanner = null;
// =====================================================
// MODE DU SCANNER : PRÉSENCE OU RETURN GIFT
// =====================================================

let scannerMode = "presence";

function setMode(mode) {

  scannerMode = mode;

  const title =
    document.getElementById("modeTitle");

  const result =
    document.getElementById("result");


  if (mode === "gift") {

    title.innerHTML =
      "🎁 Distribution Return Gift";

    result.innerHTML =
      "Mode Return Gift sélectionné.<br><br>" +
      "📷 Appuyez sur Scanner le QR.";

  } else {

    title.innerHTML =
      "Contrôle de présence";

    result.innerHTML =
      "Mode contrôle de présence sélectionné.<br><br>" +
      "📷 Appuyez sur Scanner le QR.";

  }

}

    function setModeAndScan(mode) {

  setMode(mode);

  const result =
    document.getElementById("result");

  if (mode === "gift") {

    result.innerHTML =
      "🎁 Return Gift<br>" +
      "📷 Scanner le QR code";

  } else {

    result.innerHTML =
      "📷 Contrôle de présence<br>" +
      "Scanner le QR code";

  }

  startScanner();

}
    // =====================================================
    // DÉMARRER LE SCANNER
    // =====================================================

    async function startScanner() {

      const result =
        document.getElementById("result");

      result.innerHTML =
        "📷 Recherche de la caméra...";


      try {

        const cameras =
          await Html5Qrcode.getCameras();


        if (!cameras || cameras.length === 0) {

          result.innerHTML =
            "<span class='error'>" +
            "❌ Aucune caméra détectée." +
            "</span>";

          return;

        }


        let cameraId =
          cameras[0].id;


        // Chercher la caméra arrière

        for (let camera of cameras) {

          const label =
            (camera.label || "").toLowerCase();


          if (
            label.includes("back") ||
            label.includes("rear") ||
            label.includes("environment") ||
            label.includes("arrière")
          ) {

            cameraId =
              camera.id;

            break;

          }

        }


        scanner =
          new Html5Qrcode("reader");


        await scanner.start(

          cameraId,

          {
            fps: 10,

            qrbox: {
              width: 250,
              height: 250
            }
          },


          function(decodedText) {

  scanner.stop();

  if (scannerMode === "gift") {

    verifyReturnGift(decodedText);

  } else {

    verifyFamily(decodedText);

  }

},
          


          function(errorMessage) {

            // Ignorer les erreurs normales

          }

        );


        result.innerHTML =
          "📷 Présentez le QR code devant la caméra.";


      } catch (error) {

        result.innerHTML =
          "<span class='error'>" +
          "❌ Impossible d'utiliser la caméra.<br><br>" +
          error +
          "</span>";

      }

    }


    // =====================================================
    // ARRÊTER LE SCANNER
    // =====================================================

    function stopScanner() {

      if (scanner) {

        scanner
          .stop()
          .catch(function() {});

      }


      document.getElementById("reader")
        .innerHTML = "";


      document.getElementById("result")
        .innerHTML =
        "Scanner arrêté.";

    }


    // =====================================================
    // RECHERCHER LA FAMILLE
    // =====================================================

    async function verifyFamily(familyId) {

      const result =
        document.getElementById("result");


      result.innerHTML =
        "⏳ Recherche de la famille...";


      try {

        const response =
          await fetch(API_URL, {

            method: "POST",

            headers: {
              "Content-Type":
                "text/plain;charset=utf-8"
            },

            body: JSON.stringify({

              action:
                "findFamily",

              familyId:
                familyId

            })

          });


        const data =
          await response.json();


        if (!data.success) {

          result.innerHTML =
            "<span class='error'>" +
            "❌ " +
            data.message +
            "</span>";

          return;

        }


        showFamily(data);


      } catch (error) {

        result.innerHTML =
          "<span class='error'>" +
          "❌ Erreur de connexion.<br><br>" +
          error.message +
          "</span>";

      }

    }

// =====================================================
// RETURN GIFT - VÉRIFIER LE QR
// =====================================================

async function verifyReturnGift(familyId) {

  const result =
    document.getElementById("result");

  result.innerHTML =
    "⏳ Vérification Return Gift...";

  try {

    const response =
      await fetch(API_URL, {

        method: "POST",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body: JSON.stringify({

          action: "findReturnGift",

          familyId: familyId

        })

      });

    const data =
      await response.json();


    if (!data.success) {

      result.innerHTML =
        "<span class='error'>" +
        "❌ " +
        data.message +
        "</span>";

      return;
    }


    // ===============================================
    // CADEAUX DÉJÀ DISTRIBUÉS
    // ===============================================

    if (data.alreadyDistributed) {

      result.innerHTML =

        "<span class='error'>" +

        "⚠️ RETURN GIFT DÉJÀ DISTRIBUÉ" +

        "</span>" +

        "<br><br>" +

        "<strong>" +
        data.familyId +
        "</strong>" +

        "<br><br>" +

        "Cadeaux déjà remis : " +

        "<strong>" +
        data.giftsGiven +
        "</strong>";

      return;
    }


    // ===============================================
    // CADEAUX À DISTRIBUER
    // ===============================================

    result.innerHTML =

      "<strong>" +
      data.familyId +
      "</strong>" +

      "<br><br>" +

      "Participants présents : " +

      "<strong>" +
      data.totalPresent +
      "</strong>" +

      "<br><br>" +

      "🎁 Cadeaux à remettre : " +

      "<strong>" +
      data.giftsAllowed +
      "</strong>" +

      "<br><br>" +

      "<button onclick='saveReturnGift(" +
      JSON.stringify(data.familyId) +
      ")'>" +

      "🎁 DISTRIBUER" +

      "</button>";


  } catch (error) {

    result.innerHTML =
      "<span class='error'>" +
      "❌ Erreur de connexion.<br><br>" +
      error.message +
      "</span>";

  }

}
    
    // =====================================================
    // AFFICHER LA FAMILLE
    // =====================================================

function showFamily(data) {

  let message = "";

  // =====================================================
  // QR DÉJÀ ENREGISTRÉ
  // =====================================================

  if (data.alreadyScanned) {

    message =

      "<span class='error'>" +
      "⚠️ QR DÉJÀ ENREGISTRÉ" +
      "</span>" +

      "<br><br>" +

      "<strong>" +
      data.familyId +
      "</strong>" +

      "<br><br>" +

      "Participants inscrits : " +
      "<strong>" +
      data.registered +
      "</strong>" +

      "<br><br>" +

      "Participants déjà présents : " +
      "<strong>" +
      data.alreadyPresent +
      "</strong>" +

      "<br><br>" +

      "Combien de nouvelles personnes arrivent maintenant ?" +

      "<br>" +

      "<input " +
      "id='presentNow' " +
      "type='number' " +
      "min='0' " +
      "inputmode='numeric'>" +

      "<br>" +

      "<button onclick='savePresence(" +
      JSON.stringify(data.familyId) +
      ")'>" +

      "➕ AJOUTER" +

      "</button>";

  }

  // =====================================================
  // PREMIER SCAN
  // =====================================================

  else {

    message =

      "<strong>" +
      data.familyId +
      "</strong>" +

      "<br><br>" +

      "Participants inscrits : " +

      "<strong>" +
      data.registered +
      "</strong>" +

      "<br><br>" +

      "Combien de personnes sont présentes maintenant ?" +

      "<br>" +

      "<input " +
      "id='presentNow' " +
      "type='number' " +
      "min='0' " +
      "inputmode='numeric'>" +

      "<br>" +

      "<button onclick='savePresence(" +
      JSON.stringify(data.familyId) +
      ")'>" +

      "✅ VALIDER" +

      "</button>";

  }


  document.getElementById("result").innerHTML =
    message;

}


    // =====================================================
    // ENREGISTRER LA PRÉSENCE
    // =====================================================

    async function savePresence(familyId) {

      const input =
        document.getElementById("presentNow");


      const number =
        Number(input.value);


      if (
        !Number.isInteger(number) ||
        number < 0
      ) {

        alert(
          "Veuillez entrer un nombre valide."
        );

        return;

      }


      document.getElementById("result")
        .innerHTML =
        "⏳ Enregistrement...";


      try {

        const response =
          await fetch(API_URL, {

            method: "POST",

            headers: {
              "Content-Type":
                "text/plain;charset=utf-8"
            },

            body: JSON.stringify({

              action:
                "savePresence",

              familyId:
                familyId,

              numberNow:
                number

            })

          });


        const data =
          await response.json();


        if (!data.success) {

          document.getElementById("result")
            .innerHTML =

            "<span class='error'>" +

            "❌ " +

            data.message +

            "</span>";

          return;

        }


        document.getElementById("result")
          .innerHTML =

          "<span class='success'>" +

          "✅ Présence enregistrée" +

          "<br><br>" +

          familyId +

          "<br><br>" +

          "Participants inscrits : " +

          data.registered +

          "<br>" +

          "Total présent : " +

          data.totalPresent +

          "<br>" +

          "Participants supplémentaires : " +

          data.additional +

          "</span>" +

          "<br><br>" +

          "<button onclick='startScanner()'>" +

          "📷 SCANNER LE PROCHAIN QR" +

          "</button>";


      } catch (error) {

        document.getElementById("result")
          .innerHTML =

          "<span class='error'>" +

          "❌ Erreur de connexion.<br><br>" +

          error.message +

          "</span>";

      }

    }
// =====================================================
// RETURN GIFT - ENREGISTRER LA DISTRIBUTION
// =====================================================

async function saveReturnGift(familyId) {

  const result =
    document.getElementById("result");

  result.innerHTML =
    "⏳ Enregistrement des cadeaux...";

  try {

    const response =
      await fetch(API_URL, {

        method: "POST",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body: JSON.stringify({

          action: "saveReturnGift",

          familyId: familyId

        })

      });


    const data =
      await response.json();


    // Cadeaux déjà distribués
    if (!data.success) {

      if (data.alreadyDistributed) {

        result.innerHTML =

          "<span class='error'>" +

          "⚠️ RETURN GIFT DÉJÀ DISTRIBUÉ" +

          "</span>" +

          "<br><br>" +

          "<strong>" +
          familyId +
          "</strong>" +

          "<br><br>" +

          "Cadeaux déjà remis : " +

          "<strong>" +
          data.giftsGiven +
          "</strong>";

        return;

      }


      result.innerHTML =

        "<span class='error'>" +

        "❌ " +

        data.message +

        "</span>";

      return;

    }


    // Distribution réussie
    result.innerHTML =

      "<span class='success'>" +

      "✅ RETURN GIFT DISTRIBUÉ" +

      "</span>" +

      "<br><br>" +

      "<strong>" +
      data.familyId +
      "</strong>" +

      "<br><br>" +

      "Participants présents : " +

      "<strong>" +
      data.totalPresent +
      "</strong>" +

      "<br><br>" +

      "🎁 Cadeaux remis : " +

      "<strong>" +
      data.giftsGiven +
      "</strong>" +

      "<br><br>" +

      "<button onclick='startScanner()'>" +

      "🎁 SCANNER LE PROCHAIN QR" +

      "</button>";


  } catch (error) {

    result.innerHTML =

      "<span class='error'>" +

      "❌ Erreur de connexion.<br><br>" +

      error.message +

      "</span>";

  }

}
  </script>
<div class="temple-footer">

  <div class="footer-ornament">
    ❈ ॐ ❈
  </div>

  <div>
    Srivari Srinivasa Kalyanam 2026
  </div>

</div>
</body>
</html>
